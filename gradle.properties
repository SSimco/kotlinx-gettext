kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
ksp.useKSP2=true

# Publish to Maven Central through the Central Portal and sign every publication.
# Pass -PsignAllPublications=false to publish to Maven Local without a GPG key.
mavenCentralPublishing=true
signAllPublications=true

# POM metadata shared by the published Maven Central artifacts.
# The com.vanniktech.maven.publish plugin reads these properties.
POM_URL=https://github.com/ssimco/kotlinx-gettext
POM_SCM_URL=https://github.com/ssimco/kotlinx-gettext/tree/main
POM_SCM_CONNECTION=scm:git:https://github.com/ssimco/kotlinx-gettext.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ssimco/kotlinx-gettext.git
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
